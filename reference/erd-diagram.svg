<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .entity-box { rx: 8; ry: 8; stroke-width: 2; }
      .entity-header { rx: 8; ry: 8; }
      .entity-title { font-weight: 700; font-size: 15px; fill: #fff; }
      .col-name { font-size: 12px; fill: #1a1a1a; font-family: 'Fira Code', 'Consolas', monospace; }
      .col-type { font-size: 10px; fill: #6b7280; font-family: 'Fira Code', 'Consolas', monospace; }
      .pk-badge { font-size: 9px; fill: #f59e0b; font-weight: 700; }
      .fk-badge { font-size: 9px; fill: #3b82f6; font-weight: 700; }
      .rel-line { fill: none; stroke-width: 2; }
      .rel-label { font-size: 10px; fill: #6b7280; font-family: system-ui; }
      .legend-text { font-size: 11px; fill: #374151; font-family: system-ui; }
      .legend-title { font-size: 13px; fill: #111827; font-weight: 700; font-family: system-ui; }
    </style>
    <marker id="cascade" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="restrict" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <rect x="0" y="0" width="10" height="10" fill="#d97706" rx="2"/>
    </marker>
    <marker id="setnull" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <circle cx="5" cy="5" r="4" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#fafaf8" rx="12"/>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111827" font-family="system-ui">Tenantory — Entity Relationship Diagram</text>
  <text x="700" y="56" text-anchor="middle" font-size="12" fill="#6b7280" font-family="system-ui">Multi-Tenant E-Commerce Inventory &amp; Catalog System</text>

  <!-- ==================== TENANT ==================== -->
  <rect class="entity-box" x="520" y="80" width="240" height="180" fill="#fff" stroke="#dc2626"/>
  <rect class="entity-header" x="520" y="80" width="240" height="32" fill="#dc2626"/>
  <text class="entity-title" x="640" y="101" text-anchor="middle">tenant</text>
  <!-- columns -->
  <text class="pk-badge" x="534" y="128">PK</text>
  <text class="col-name" x="554" y="128">id</text>
  <text class="col-type" x="660" y="128">uuid</text>

  <text class="col-name" x="554" y="146">domain_name</text>
  <text class="col-type" x="660" y="146">varchar(255)</text>

  <text class="col-name" x="554" y="164">business_name</text>
  <text class="col-type" x="660" y="164">varchar(255)</text>

  <text class="col-name" x="554" y="182">status</text>
  <text class="col-type" x="660" y="182">enum</text>

  <text class="col-name" x="554" y="200">created_at</text>
  <text class="col-type" x="660" y="200">timestamptz</text>

  <text class="col-name" x="554" y="218">updated_at</text>
  <text class="col-type" x="660" y="218">timestamptz</text>

  <text class="col-name" x="554" y="236">deleted_at</text>
  <text class="col-type" x="660" y="236">timestamptz</text>

  <!-- ==================== CATEGORY ==================== -->
  <rect class="entity-box" x="120" y="330" width="250" height="220" fill="#fff" stroke="#059669"/>
  <rect class="entity-header" x="120" y="330" width="250" height="32" fill="#059669"/>
  <text class="entity-title" x="245" y="351" text-anchor="middle">category</text>
  <text class="pk-badge" x="134" y="378">PK</text>
  <text class="col-name" x="154" y="378">id</text>
  <text class="col-type" x="260" y="378">uuid</text>

  <text class="col-name" x="154" y="396">name</text>
  <text class="col-type" x="260" y="396">varchar(120)</text>

  <text class="col-name" x="154" y="414">slug</text>
  <text class="col-type" x="260" y="414">varchar(150)</text>

  <text class="fk-badge" x="134" y="432">FK</text>
  <text class="col-name" x="154" y="432">tenant_id</text>
  <text class="col-type" x="260" y="432">uuid</text>

  <text class="fk-badge" x="134" y="450">FK</text>
  <text class="col-name" x="154" y="450">parent_id</text>
  <text class="col-type" x="260" y="450">uuid (self)</text>

  <text class="col-name" x="154" y="468">created_at</text>
  <text class="col-type" x="260" y="468">timestamptz</text>

  <text class="col-name" x="154" y="486">updated_at</text>
  <text class="col-type" x="260" y="486">timestamptz</text>

  <text class="col-name" x="154" y="504">deleted_at</text>
  <text class="col-type" x="260" y="504">timestamptz</text>

  <text class="rel-label" x="130" y="530" fill="#6366f1" font-weight="600">UNIQUE (tenant, name)</text>
  <text class="rel-label" x="240" y="530" fill="#6366f1" font-weight="600">UNIQUE (tenant, slug)</text>

  <!-- ==================== PRODUCT ==================== -->
  <rect class="entity-box" x="480" y="380" width="250" height="250" fill="#fff" stroke="#2563eb"/>
  <rect class="entity-header" x="480" y="380" width="250" height="32" fill="#2563eb"/>
  <text class="entity-title" x="605" y="401" text-anchor="middle">product</text>
  <text class="pk-badge" x="494" y="428">PK</text>
  <text class="col-name" x="514" y="428">id</text>
  <text class="col-type" x="620" y="428">uuid</text>

  <text class="fk-badge" x="494" y="446">FK</text>
  <text class="col-name" x="514" y="446">tenant_id</text>
  <text class="col-type" x="620" y="446">uuid</text>

  <text class="fk-badge" x="494" y="464">FK</text>
  <text class="col-name" x="514" y="464">category_id</text>
  <text class="col-type" x="620" y="464">uuid</text>

  <text class="col-name" x="514" y="482">name</text>
  <text class="col-type" x="620" y="482">varchar(255)</text>

  <text class="col-name" x="514" y="500">description</text>
  <text class="col-type" x="620" y="500">text</text>

  <text class="col-name" x="514" y="518">sku_prefix</text>
  <text class="col-type" x="620" y="518">varchar(10)</text>

  <text class="col-name" x="514" y="536">is_active</text>
  <text class="col-type" x="620" y="536">boolean</text>

  <text class="col-name" x="514" y="554">created_at</text>
  <text class="col-type" x="620" y="554">timestamptz</text>

  <text class="col-name" x="514" y="572">updated_at</text>
  <text class="col-type" x="620" y="572">timestamptz</text>

  <text class="col-name" x="514" y="590">deleted_at</text>
  <text class="col-type" x="620" y="590">timestamptz</text>

  <!-- ==================== PRODUCT VARIANT ==================== -->
  <rect class="entity-box" x="480" y="680" width="310" height="210" fill="#fff" stroke="#7c3aed"/>
  <rect class="entity-header" x="480" y="680" width="310" height="32" fill="#7c3aed"/>
  <text class="entity-title" x="635" y="701" text-anchor="middle">product_variant</text>
  <text class="pk-badge" x="494" y="728">PK</text>
  <text class="col-name" x="514" y="728">id</text>
  <text class="col-type" x="680" y="728">uuid</text>

  <text class="fk-badge" x="494" y="746">FK</text>
  <text class="col-name" x="514" y="746">tenant_id</text>
  <text class="col-type" x="680" y="746">uuid</text>

  <text class="fk-badge" x="494" y="764">FK</text>
  <text class="col-name" x="514" y="764">product_id</text>
  <text class="col-type" x="680" y="764">uuid</text>

  <text class="col-name" x="514" y="782">sku</text>
  <text class="col-type" x="680" y="782">varchar(100)</text>

  <text class="col-name" x="514" y="800">price</text>
  <text class="col-type" x="680" y="800">decimal(12,2)</text>

  <text class="col-name" x="514" y="818">attributes</text>
  <text class="col-type" x="680" y="818">jsonb</text>

  <text class="col-name" x="514" y="836">created_at</text>
  <text class="col-type" x="680" y="836">timestamptz</text>

  <text class="col-name" x="514" y="854">deleted_at</text>
  <text class="col-type" x="680" y="854">timestamptz</text>

  <text class="rel-label" x="500" y="878" fill="#6366f1" font-weight="600">UNIQUE (tenant, sku)</text>

  <!-- ==================== WAREHOUSE ==================== -->
  <rect class="entity-box" x="900" y="330" width="230" height="180" fill="#fff" stroke="#0891b2"/>
  <rect class="entity-header" x="900" y="330" width="230" height="32" fill="#0891b2"/>
  <text class="entity-title" x="1015" y="351" text-anchor="middle">warehouse</text>
  <text class="pk-badge" x="914" y="378">PK</text>
  <text class="col-name" x="934" y="378">id</text>
  <text class="col-type" x="1030" y="378">uuid</text>

  <text class="fk-badge" x="914" y="396">FK</text>
  <text class="col-name" x="934" y="396">tenant_id</text>
  <text class="col-type" x="1030" y="396">uuid</text>

  <text class="col-name" x="934" y="414">name</text>
  <text class="col-type" x="1030" y="414">varchar(255)</text>

  <text class="col-name" x="934" y="432">location</text>
  <text class="col-type" x="1030" y="432">varchar(500)</text>

  <text class="col-name" x="934" y="450">created_at</text>
  <text class="col-type" x="1030" y="450">timestamptz</text>

  <text class="col-name" x="934" y="468">updated_at</text>
  <text class="col-type" x="1030" y="468">timestamptz</text>

  <text class="col-name" x="934" y="486">deleted_at</text>
  <text class="col-type" x="1030" y="486">timestamptz</text>

  <!-- ==================== STOCK LEVEL ==================== -->
  <rect class="entity-box" x="880" y="680" width="290" height="210" fill="#fff" stroke="#ea580c"/>
  <rect class="entity-header" x="880" y="680" width="290" height="32" fill="#ea580c"/>
  <text class="entity-title" x="1025" y="701" text-anchor="middle">stock_level</text>
  <text class="pk-badge" x="894" y="728">PK</text>
  <text class="col-name" x="914" y="728">id</text>
  <text class="col-type" x="1080" y="728">uuid</text>

  <text class="fk-badge" x="894" y="746">FK</text>
  <text class="col-name" x="914" y="746">tenant_id</text>
  <text class="col-type" x="1080" y="746">uuid</text>

  <text class="fk-badge" x="894" y="764">FK</text>
  <text class="col-name" x="914" y="764">variant_id</text>
  <text class="col-type" x="1080" y="764">uuid</text>

  <text class="fk-badge" x="894" y="782">FK</text>
  <text class="col-name" x="914" y="782">warehouse_id</text>
  <text class="col-type" x="1080" y="782">uuid</text>

  <text class="col-name" x="914" y="800">available_quantity</text>
  <text class="col-type" x="1080" y="800">int</text>

  <text class="col-name" x="914" y="818">reserved_quantity</text>
  <text class="col-type" x="1080" y="818">int</text>

  <text class="col-name" x="914" y="836">safety_threshold</text>
  <text class="col-type" x="1080" y="836">int</text>

  <text class="col-name" x="914" y="854">version</text>
  <text class="col-type" x="1080" y="854">int (optimistic lock)</text>

  <text class="col-name" x="914" y="872">created_at</text>
  <text class="col-type" x="1080" y="872">timestamptz</text>

  <text class="rel-label" x="900" y="895" fill="#6366f1" font-weight="600">UNIQUE (variant, warehouse)</text>

  <!-- ==================== SUPPLIER ==================== -->
  <rect class="entity-box" x="1150" y="330" width="220" height="200" fill="#fff" stroke="#9333ea"/>
  <rect class="entity-header" x="1150" y="330" width="220" height="32" fill="#9333ea"/>
  <text class="entity-title" x="1260" y="351" text-anchor="middle">supplier</text>
  <text class="pk-badge" x="1164" y="378">PK</text>
  <text class="col-name" x="1184" y="378">id</text>
  <text class="col-type" x="1280" y="378">uuid</text>

  <text class="fk-badge" x="1164" y="396">FK</text>
  <text class="col-name" x="1184" y="396">tenant_id</text>
  <text class="col-type" x="1280" y="396">uuid</text>

  <text class="col-name" x="1184" y="414">company_name</text>
  <text class="col-type" x="1280" y="414">varchar(255)</text>

  <text class="col-name" x="1184" y="432">contact_email</text>
  <text class="col-type" x="1280" y="432">varchar(255)</text>

  <text class="col-name" x="1184" y="450">contact_phone</text>
  <text class="col-type" x="1280" y="450">varchar(50)</text>

  <text class="col-name" x="1184" y="468">address</text>
  <text class="col-type" x="1280" y="468">varchar(500)</text>

  <text class="col-name" x="1184" y="486">lead_time_days</text>
  <text class="col-type" x="1280" y="486">int</text>

  <text class="col-name" x="1184" y="504">created_at</text>
  <text class="col-type" x="1280" y="504">timestamptz</text>

  <text class="col-name" x="1184" y="522">deleted_at</text>
  <text class="col-type" x="1280" y="522">timestamptz</text>

  <!-- ==================== RELATIONSHIPS ==================== -->

  <!-- Tenant -> Category (CASCADE) -->
  <line class="rel-line" x1="560" y1="260" x2="280" y2="330" stroke="#dc2626" stroke-dasharray="6,3" marker-end="url(#cascade)"/>
  <text x="400" y="288" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="380" y="298" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- Tenant -> Product (CASCADE) -->
  <line class="rel-line" x1="600" y1="260" x2="580" y2="380" stroke="#dc2626" stroke-dasharray="6,3" marker-end="url(#cascade)"/>
  <text x="575" y="310" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="560" y="320" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- Tenant -> Warehouse (CASCADE) -->
  <line class="rel-line" x1="680" y1="260" x2="960" y2="330" stroke="#dc2626" stroke-dasharray="6,3" marker-end="url(#cascade)"/>
  <text x="830" y="288" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="810" y="298" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- Tenant -> Supplier (CASCADE) -->
  <line class="rel-line" x1="720" y1="260" x2="1210" y2="330" stroke="#dc2626" stroke-dasharray="6,3" marker-end="url(#cascade)"/>
  <text x="1000" y="288" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="980" y="298" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- Category -> Product (RESTRICT) -->
  <line class="rel-line" x1="370" y1="440" x2="480" y2="464" stroke="#d97706" marker-end="url(#restrict)"/>
  <text x="398" y="444" fill="#d97706" font-size="9" font-weight="600">1 : *</text>
  <text x="395" y="454" fill="#d97706" font-size="8">RESTRICT</text>

  <!-- Category -> Category (self-ref, SET NULL) -->
  <path class="rel-line" d="M 180 330 C 80 330, 80 430, 120 430" stroke="#6366f1" stroke-dasharray="4,3" marker-end="url(#setnull)"/>
  <text x="68" y="380" fill="#6366f1" font-size="9" font-weight="600">self</text>
  <text x="58" y="392" fill="#6366f1" font-size="8">SET NULL</text>

  <!-- Product -> ProductVariant (CASCADE) -->
  <line class="rel-line" x1="605" y1="630" x2="605" y2="680" stroke="#dc2626" marker-end="url(#cascade)"/>
  <text x="612" y="655" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="612" y="665" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- ProductVariant -> StockLevel (CASCADE) -->
  <line class="rel-line" x1="790" y1="760" x2="880" y2="760" stroke="#dc2626" marker-end="url(#cascade)"/>
  <text x="810" y="752" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="810" y="742" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- Warehouse -> StockLevel (CASCADE) -->
  <line class="rel-line" x1="1015" y1="510" x2="1015" y2="680" stroke="#dc2626" stroke-dasharray="6,3" marker-end="url(#cascade)"/>
  <text x="1022" y="580" fill="#dc2626" font-size="9" font-weight="600">1 : *</text>
  <text x="1022" y="590" fill="#dc2626" font-size="8">CASCADE</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="20" y="580" width="420" height="210" fill="#fff" stroke="#e5e7eb" rx="8"/>
  <text class="legend-title" x="40" y="605">Legend</text>

  <line x1="40" y1="628" x2="90" y2="628" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <marker id="leg-cascade" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
  </marker>
  <line x1="90" y1="628" x2="120" y2="628" stroke="#dc2626" stroke-width="2" marker-end="url(#leg-cascade)"/>
  <text class="legend-text" x="130" y="632">CASCADE — parent deleted → children deleted</text>

  <line x1="40" y1="658" x2="120" y2="658" stroke="#d97706" stroke-width="2"/>
  <rect x="118" y="654" width="8" height="8" fill="#d97706" rx="2"/>
  <text class="legend-text" x="130" y="662">RESTRICT — block delete if children exist</text>

  <line x1="40" y1="688" x2="90" y2="688" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="124" cy="688" r="4" fill="#6366f1"/>
  <text class="legend-text" x="130" y="692">SET NULL — parent deleted → child FK becomes null</text>

  <rect x="40" y="715" width="12" height="12" fill="#fff" stroke="#dc2626" rx="2"/>
  <text class="legend-text" x="60" y="726">Tenant-scoped entity (has tenant_id FK)</text>

  <text class="pk-badge" x="40" y="752">PK</text>
  <text class="legend-text" x="60" y="752">Primary Key</text>
  <text class="fk-badge" x="140" y="752">FK</text>
  <text class="legend-text" x="160" y="752">Foreign Key</text>

  <text x="280" y="632" font-size="9" fill="#6b7280">1 : *  =  one-to-many</text>
  <text x="280" y="652" font-size="9" fill="#6b7280">self     =  self-referencing</text>
  <text x="280" y="672" font-size="9" fill="#6b7280">Version = optimistic locking</text>

  <!-- Footer -->
  <text x="700" y="895" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="system-ui">Tenantory — Shared Database, Shared Schema with Row-Level Filtering</text>
</svg>
