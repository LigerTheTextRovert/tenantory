global:
  scrape_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # NestJS app container on the same compose network
  - job_name: tenantory-app
    metrics_path: /api/v1/prometheus
    static_configs:
      - targets: ['app:3000']
